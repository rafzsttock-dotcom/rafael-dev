<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin — KODO Rewards</title>
<style>
:root{--bg:#fff8e7;--ink:#1b1630;--violet:#8b6cff;--yellow:#ffd23f;--line:#1b1630;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#171326;--ink:#f4efff;--line:#f4efff;--card:#221c38}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding:16px}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,input,select{font:inherit;color:inherit}
button{background:var(--yellow);color:#1b1630;border:3px solid var(--line);border-radius:11px;padding:7px 13px;font-weight:700;cursor:pointer}
button.p{background:var(--violet);color:#fff}button.on{background:var(--violet);color:#fff}
input,select{background:var(--card);border:2px solid var(--line);border-radius:9px;padding:7px 9px}
.card{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px;margin:12px 0;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #8884;white-space:nowrap}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.kpi{display:flex;gap:12px;flex-wrap:wrap}.kpi div{flex:1;min-width:150px;border:3px solid var(--line);border-radius:12px;padding:12px;background:var(--card)}.kpi b{font-size:1.6rem;display:block}
#msg{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>Admin KODO</h1>
<div id="login" class="card" style="display:none">
  <div class="row"><input id="pw" type="password" placeholder="Password admin" autocomplete="current-password"><button class="p" id="go">Masuk</button></div>
</div>
<div id="main" style="display:none">
<nav id="tabs"></nav>
<div id="view"></div>
</div>
</div>
<div id="msg"></div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function say(t){var m=$('#msg');m.textContent=t;m.style.display='block';setTimeout(function(){m.style.display='none';},2500);}
function api(p,m,b){return fetch('/api/admin'+p,{method:m||'GET',headers:b?{'content-type':'application/json'}:{},body:b?JSON.stringify(b):undefined,credentials:'same-origin'})
  .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(r.status===401){showLogin();throw new Error('login');}if(!r.ok)throw new Error(j.error||'Gagal');return j;});});}
function showLogin(){$('#main').style.display='none';$('#login').style.display='block';}
function ts(t){return new Date(t*1000).toLocaleString('id-ID');}
function tbl(head,rows){return '<table><tr>'+head.map(function(h){return '<th>'+h+'</th>';}).join('')+'</tr>'+rows.join('')+'</table>';}
var TABS={
 overview:['Ringkasan',function(v){return api('/overview').then(function(o){v.innerHTML='<div class="kpi"><div><b>'+o.users+'</b>Pengguna terverifikasi</div><div><b>'+Number(o.points_outstanding).toLocaleString('id-ID')+'</b>Poin beredar</div><div><b>'+o.pending_withdrawals+'</b>Penarikan menunggu</div></div>';});}],
 wd:['Penarikan',function(v){return api('/withdrawals').then(function(l){v.innerHTML='<div class="card">'+tbl(['#','Waktu','HP','Poin','Metode','Tujuan','Status',''],l.map(function(w){
   return '<tr><td>'+w.id+'</td><td>'+ts(w.ts)+'</td><td>'+esc(w.phone)+'</td><td>'+w.points+'</td><td>'+esc(w.method)+'</td><td>'+esc(w.account)+'</td><td>'+esc(w.status)+'</td><td>'+(w.status==='pending'?'<button data-wd="'+w.id+'" data-s="paid">Sudah dibayar</button> <button data-wd="'+w.id+'" data-s="rejected">Tolak</button>':esc(w.note||''))+'</td></tr>';}))+'</div>';
   v.querySelectorAll('[data-wd]').forEach(function(b){b.onclick=function(){var s=b.dataset.s,note=s==='rejected'?(prompt('Alasan penolakan (dikirim ke catatan):')||''):'';if(s==='paid'&&!confirm('Pastikan transfer sudah kamu lakukan. Tandai dibayar?'))return;api('/withdrawals/'+b.dataset.wd,'POST',{status:s,note:note}).then(function(){say('OK');show('wd');}).catch(function(e){say(e.message);});};});});}],
 rd:['Penukaran',function(v){return api('/redemptions').then(function(l){v.innerHTML='<div class="card">'+tbl(['#','Waktu','HP','Reward','Poin','Status',''],l.map(function(w){
   return '<tr><td>'+w.id+'</td><td>'+ts(w.ts)+'</td><td>'+esc(w.phone)+'</td><td>'+esc(w.title)+'</td><td>'+w.cost+'</td><td>'+esc(w.status)+'</td><td>'+(w.status==='pending'?'<button data-rd="'+w.id+'" data-s="done">Selesai</button> <button data-rd="'+w.id+'" data-s="rejected">Tolak</button>':'')+'</td></tr>';}))+'</div>';
   v.querySelectorAll('[data-rd]').forEach(function(b){b.onclick=function(){api('/redemptions/'+b.dataset.rd,'POST',{status:b.dataset.s}).then(function(){say('OK');show('rd');}).catch(function(e){say(e.message);});};});});}],
 us:['Pengguna',function(v){return api('/users').then(function(l){v.innerHTML='<div class="card">'+tbl(['ID','HP','Telegram','Poin','Daftar','Status'],l.map(function(u){
   return '<tr><td>'+u.id+'</td><td>'+esc(u.phone)+'</td><td>'+esc(u.tg_name)+'</td><td>'+u.points+'</td><td>'+ts(u.created)+'</td><td><button data-ban="'+u.id+'" data-b="'+(u.banned?0:1)+'">'+(u.banned?'Buka blokir':'Blokir')+'</button></td></tr>';}))+'</div>';
   v.querySelectorAll('[data-ban]').forEach(function(b){b.onclick=function(){api('/users/'+b.dataset.ban+'/ban','POST',{banned:b.dataset.b==='1'}).then(function(){show('us');});};});});}],
 ms:['Misi',function(v){return api('/missions').then(function(l){
   var types=['daily','once','join_channel','start_bot','tap_link'];
   function form(m){m=m||{};return '<div class="row" data-f><input type="hidden" name="id" value="'+(m.id||'')+'"><input name="title" placeholder="Judul" value="'+esc(m.title)+'"><input name="descr" placeholder="Deskripsi" value="'+esc(m.descr)+'"><input name="reward" type="number" placeholder="Poin" style="width:90px" value="'+(m.reward||'')+'"><select name="type">'+types.map(function(t){return '<option'+(m.type===t?' selected':'')+'>'+t+'</option>';}).join('')+'</select><input name="link" placeholder="Link / @channel" value="'+esc(m.link)+'"><label><input type="checkbox" name="active"'+(m.id?(m.active?' checked':''):' checked')+'> aktif</label><button class="p">Simpan</button></div>';}
   v.innerHTML='<div class="card"><b>Misi baru</b>'+form()+'</div><div class="card">'+l.map(form).join('')+'</div><p>daily = bisa diklaim tiap hari; once = sekali; join_channel/start_bot diverifikasi bot; tap_link harus dibuka dulu.</p>';
   v.querySelectorAll('[data-f]').forEach(function(f){f.querySelector('button').onclick=function(){var g=function(n){return f.querySelector('[name='+n+']');};api('/missions','POST',{id:g('id').value||undefined,title:g('title').value,descr:g('descr').value,reward:+g('reward').value,type:g('type').value,link:g('link').value,active:g('active').checked}).then(function(){say('Tersimpan');show('ms');}).catch(function(e){say(e.message);});};});});}],
 rw:['Reward',function(v){return api('/rewards').then(function(l){
   function form(m){m=m||{};return '<div class="row" data-f><input type="hidden" name="id" value="'+(m.id||'')+'"><input name="title" placeholder="Nama reward" value="'+esc(m.title)+'"><input name="cost" type="number" placeholder="Harga poin" style="width:120px" value="'+(m.cost||'')+'"><label><input type="checkbox" name="active"'+(m.id?(m.active?' checked':''):' checked')+'> aktif</label><button class="p">Simpan</button></div>';}
   v.innerHTML='<div class="card"><b>Reward baru</b>'+form()+'</div><div class="card">'+l.map(form).join('')+'</div>';
   v.querySelectorAll('[data-f]').forEach(function(f){f.querySelector('button').onclick=function(){var g=function(n){return f.querySelector('[name='+n+']');};api('/rewards','POST',{id:g('id').value||undefined,title:g('title').value,cost:+g('cost').value,active:g('active').checked}).then(function(){say('Tersimpan');show('rw');}).catch(function(e){say(e.message);});};});});}],
 st:['Pengaturan',function(v){return api('/overview').then(function(o){var s=o.settings;
   v.innerHTML='<div class="card"><div class="row">Minimal tarik (poin) <input id="s1" type="number" value="'+esc(s.min_withdraw)+'"></div><div class="row">Nilai 1 poin (Rp) <input id="s4" type="number" value="'+esc(s.point_value||1)+'"></div><div class="row">Channel wajib join (@username, kosong = tidak wajib) <input id="s2" value="'+esc(s.channel)+'"></div><div class="row">Metode (pisah koma) <input id="s3" value="'+esc(s.methods)+'" style="width:320px"></div><button class="p" id="sv">Simpan</button></div>';
   $('#sv').onclick=function(){api('/settings','POST',{min_withdraw:$('#s1').value,point_value:$('#s4').value,channel:$('#s2').value,methods:$('#s3').value}).then(function(){say('Tersimpan');});};});}]
};
function show(k){document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.k===k);});TABS[k][1]($('#view')).catch(function(){});}
Object.keys(TABS).forEach(function(k){var b=document.createElement('button');b.textContent=TABS[k][0];b.dataset.k=k;b.onclick=function(){show(k);};$('#tabs').appendChild(b);});
$('#go').onclick=function(){fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:$('#pw').value}),credentials:'same-origin'}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Gagal');});}).then(start).catch(function(e){say(e.message);});};
$('#pw').addEventListener('keydown',function(e){if(e.key==='Enter')$('#go').click();});
function start(){$('#login').style.display='none';$('#main').style.display='block';show('overview');}
api('/overview').then(start).catch(function(){showLogin();});
})();
</script>
</body>
</html>
